<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULITMS — Manage Books</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/api-node.js"></script>
    <script src="../js/confirm-dialog.js"></script>
</head>
<body>

<div class="page-bg"><div class="glow1"></div><div class="glow2"></div></div>

<!-- Dynamic Sidebar Loading Script -->
    <aside id="sidebar">
    </aside>
    <script src="../js/sidebar-loader.js"></script>
    <script>
        // Load appropriate sidebar based on user role
        loadSidebar();
    </script>

<div id="main">
    <header id="topbar">
        <div class="page-title">Manage Books</div>
        <div class="topbar-right">
            <div class="notif-btn"><i class="fas fa-bell"></i></div>
            <div class="avatar" id="header-avatar" style="width:36px;height:36px;">G</div>
            <div>
                <div class="user-name" id="header-name" style="font-size:0.82rem;">Guest</div>
                <div class="user-role" id="header-role" style="font-size:0.7rem;">Administrator</div>
            </div>
        </div>
    </header>
    <div id="content">
        <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 24px;">
            <div class="stat-card">
                <div class="label">📚 Total Books</div>
                <div class="value" id="total-books-count">0</div>
            </div>
            <div class="stat-card">
                <div class="label">📖 Total Borrowed</div>
                <div class="value" id="total-borrowed-count">0</div>
            </div>
            <div class="stat-card">
                <div class="label">✨ Actions</div>
                <button class="btn btn-primary" onclick="showAddBookModal()" style="width: 100%; margin-top: 10px;">
                    <i class="fas fa-plus"></i> Add New Book
                </button>
            </div>
        </div>
        <div class="card">
            <div class="tbl-wrap">
                <table class="table-books">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>ISBN</th>
                            <th>Category</th>
                            <th>Copies</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="manage-tbody">
                        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section-title" style="font-size: 1.2rem; margin-top: 40px; margin-bottom: 20px;">Borrowed Books Tracking</div>
        <div class="card">
            <div class="tbl-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Book Title</th>
                            <th>Student Name</th>
                            <th>Student ID</th>
                            <th>Borrowed Date</th>
                            <th>Due Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="borrowed-tbody">
                        <tr><td colspan="6" style="text-align:center;">Loading borrowed books...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">Modal Title</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="modalConfirmBtn">Confirm</button>
        </div>
    </div>
</div>

<script>
const API_URL = (window.ULITMS_API_URL || 'http://localhost:5000') + '/api';



function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm') {
    console.log('Opening modal:', title);
    const modal = document.getElementById('modalOverlay');
    const titleEl = document.getElementById('modalTitle');
    const bodyEl = document.getElementById('modalBody');
    const confirmBtn = document.getElementById('modalConfirmBtn');

    if (!modal || !titleEl || !bodyEl || !confirmBtn) {
        console.error('Modal elements not found!');
        return;
    }

    titleEl.textContent = title;
    bodyEl.innerHTML = bodyHtml;
    confirmBtn.textContent = confirmText;
    modal.classList.add('active');
    
    // Clear and set confirm action
    const newBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
    newBtn.addEventListener('click', async () => {
        console.log('Modal confirm clicked');
        if (onConfirm) await onConfirm();
        closeModal();
    });
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

async function loadManageBooks() {
    console.log('Attempting to load books...');
    const tbody = document.getElementById('manage-tbody');
    const totalCount = document.getElementById('total-books-count');
    
    const token = getToken();
    if (!token) {
        console.error('No authentication token found');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#f87171;">Authentication required. Please login.</td></tr>';
        return;
    }

    try {
        const response = await fetch(`${API_URL}/books`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        
        console.log('Books API Response Status:', response.status);
        
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('Books API Data:', data);
        
        const books = data.data?.books || data.books || [];
        const count = data.data?.total || books.length;
        
        if (totalCount) totalCount.textContent = count;
        
        if (books.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No books found in the system.</td></tr>';
            return;
        }

        // Sort books alphabetically by title
        books.sort((a, b) => a.title.localeCompare(b.title));

        tbody.innerHTML = books.map(book => `
            <tr>
                <td><strong>${book.title}</strong></td>
                <td>${book.author}</td>
                <td><code style="font-size:0.8rem;">${book.isbn || 'N/A'}</code></td>
                <td><span class="badge badge-teal">${book.category_name || 'Uncategorized'}</span></td>
                <td>${book.available_copies}/${book.total_copies}</td>
                <td>
                    <div style="display: flex; gap: 5px; justify-content: center;">
                        <button class="btn btn-small btn-secondary" onclick="editBook(${book.id})">Edit</button>
                        <button class="btn btn-small btn-warning" onclick="reportDamage(${book.id}, '${book.title.replace(/'/g, "\\'")}')" title="Report Damage">Report Damage</button>
                        <button class="btn btn-small btn-danger" onclick="deleteBook(${book.id})">Delete</button>
                    </div>
                </td>
            </tr>
        `).join('');
        console.log(`Successfully loaded ${books.length} books.`);
    } catch(e) {
        console.error('Detailed Load Books Error:', e);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#f87171;">Failed to load books: ${e.message}</td></tr>`;
    }
}

async function editBook(id) {
    console.log('Editing book:', id);
    try {
        const response = await fetch(`${API_URL}/books/${id}`, {
            headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        const data = await response.json();
        const book = data.data?.book || data.data || data;
        
        if (!book) throw new Error('Book not found');
        
        showModal('Edit Book', `
            <div class="form-group"><label class="form-label">Title</label><input type="text" id="edit-title" class="form-input" value="${book.title}"></div>
            <div class="form-group"><label class="form-label">Author</label><input type="text" id="edit-author" class="form-input" value="${book.author}"></div>
            <div class="form-group"><label class="form-label">ISBN</label><input type="text" id="edit-isbn" class="form-input" value="${book.isbn || ''}"></div>
            <div class="form-group"><label class="form-label">Total Copies</label><input type="number" id="edit-copies" class="form-input" value="${book.total_copies}"></div>
        `, async () => {
            const updates = {
                title: document.getElementById('edit-title').value,
                author: document.getElementById('edit-author').value,
                isbn: document.getElementById('edit-isbn').value,
                total_copies: parseInt(document.getElementById('edit-copies').value)
            };
            
            const upResponse = await fetch(`${API_URL}/books/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken()
                },
                body: JSON.stringify(updates)
            });
            
            if (upResponse.ok) {
                showSuccess('Book updated successfully!');
                loadManageBooks();
            } else {
                showError('Failed to update book');
            }
        }, 'Update Book');
    } catch(e) {
        showError('Error: ' + e.message);
    }
}

function showAddBookModal() {
    console.log('Add Book Modal triggered');
    showModal('Add Book', `
        <div class="form-group"><label class="form-label">Title</label><input type="text" id="book-title" class="form-input"></div>
        <div class="form-group"><label class="form-label">Author</label><input type="text" id="book-author" class="form-input"></div>
        <div class="form-group"><label class="form-label">ISBN</label><input type="text" id="book-isbn" class="form-input"></div>
        <div class="form-group"><label class="form-label">Category</label><input type="text" id="book-category" class="form-input"></div>
        <div class="form-group"><label class="form-label">Total Copies</label><input type="number" id="book-copies" class="form-input"></div>
    `, async () => {
        const bookData = {
            title: document.getElementById('book-title').value,
            author: document.getElementById('book-author').value,
            isbn: document.getElementById('book-isbn').value,
            category_name: document.getElementById('book-category').value,
            total_copies: parseInt(document.getElementById('book-copies').value),
            available_copies: parseInt(document.getElementById('book-copies').value)
        };
        
        try {
            const response = await fetch(`${API_URL}/books`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken()
                },
                body: JSON.stringify(bookData)
            });
            
            if (response.ok) {
                showSuccess('Book added successfully!');
                loadManageBooks();
            } else {
                throw new Error('Failed to add book');
            }
        } catch(e) { 
            showError('Failed to add book'); 
        }
    }, 'Add Book');
}

async function deleteBook(id) {
    console.log('Deleting book:', id);
    confirmDelete(`Are you sure you want to delete this book? This action cannot be undone.`, async () => {
        showLoading('Deleting book...');
        
        try {
            const response = await fetch(`${API_URL}/books/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            
            const data = await response.json();
            
            if (data.success) {
                hideLoading();
                showSuccess('Book deleted successfully!');
                loadManageBooks();
            } else {
                throw new Error(data.message || 'Failed to delete book');
            }
        } catch(e) { 
            hideLoading();
            showError('Failed to delete book: ' + e.message); 
        }
    });
}

window.reportDamage = (id, title) => {
    window.location.href = `damage-reports.html?bookId=${id}&title=${encodeURIComponent(title)}`;
};

async function loadBorrowedBooks() {
    console.log('Attempting to load borrowed books...');
    const tbody = document.getElementById('borrowed-tbody');
    const totalBorrowedCount = document.getElementById('total-borrowed-count');
    
    try {
        const response = await fetch(`${API_URL}/borrowings?status=borrowed`, {
            headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        
        if (!response.ok) throw new Error('Failed to fetch borrowed books');
        
        const data = await response.json();
        const borrowings = data.data?.borrowings || data.borrowings || [];
        
        if (totalBorrowedCount) totalBorrowedCount.textContent = borrowings.length;
        
        if (borrowings.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No active borrowings found.</td></tr>';
            return;
        }

        tbody.innerHTML = borrowings.map(b => {
            const dueDate = new Date(b.due_date);
            const isOverdue = dueDate < new Date();
            const statusClass = isOverdue ? 'badge-danger' : 'badge-warning';
            const statusText = isOverdue ? 'OVERDUE' : 'BORROWED';

            return `
                <tr>
                    <td><strong>${b.title}</strong></td>
                    <td>${b.first_name} ${b.last_name}</td>
                    <td><code style="font-size:0.8rem;">${b.student_id}</code></td>
                    <td>${new Date(b.borrowed_at).toLocaleDateString()}</td>
                    <td><span style="color:${isOverdue ? '#f87171' : 'inherit'};">${dueDate.toLocaleDateString()}</span></td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                </tr>
            `;
        }).join('');
    } catch(e) {
        console.error('Load borrowed books error:', e);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#f87171;">Failed to load borrowed books.</td></tr>';
    }
}

checkAuth();
loadManageBooks();
loadBorrowedBooks();
</script>
</body>
</html>
