<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULITMS — Damage Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/api-node.js"></script>
</head>
<body>

<div class="page-bg"><div class="glow1"></div><div class="glow2"></div></div>

<!-- Dynamic Sidebar Loading Script -->
    <aside id="sidebar">
    </aside>
    <script src="../js/sidebar-loader.js"></script>
    <script>
        // Load appropriate sidebar based on user role
        loadSidebar();
    </script>

<div id="main">
    <header id="topbar">
        <div class="page-title">Damage Reports</div>
        <div class="topbar-right">
            <div class="notif-btn"><i class="fas fa-bell"></i></div>
            <div class="avatar" id="header-avatar" style="width:36px;height:36px;">G</div>
            <div>
                <div class="user-name" id="header-name" style="font-size:0.82rem;">Guest</div>
                <div class="user-role" id="header-role" style="font-size:0.7rem;">Administrator</div>
            </div>
        </div>
    </header>
    <div id="content">
        <div class="section-title">Damage Reports</div>
        <div class="stats-grid" id="damage-stats"></div>
        <div class="card">
            <div class="tbl-wrap">
                <table class="table-damage">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Reporter</th>
                            <th>Equipment</th>
                            <th>Type</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="damage-tbody">
                        <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">Modal Title</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="modalConfirmBtn">Confirm</button>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';

function getToken() { return localStorage.getItem('ulitms_token'); }

function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm') {
    const modal = document.getElementById('modalOverlay');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalConfirmBtn').textContent = confirmText;
    modal.classList.add('active');
    
    const newBtn = document.getElementById('modalConfirmBtn').cloneNode(true);
    document.getElementById('modalConfirmBtn').parentNode.replaceChild(newBtn, document.getElementById('modalConfirmBtn'));
    newBtn.addEventListener('click', () => {
        if (onConfirm) onConfirm();
        closeModal();
    });
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

async function loadDamageReports() {
    const tbody = document.getElementById('damage-tbody');
    const statsContainer = document.getElementById('damage-stats');
    
    try {
        const response = await fetch(`${API_URL}/damage-reports`, {
            headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        const data = await response.json();
        const reports = data.reports || [];
        
        // Calculate stats
        const total = reports.length;
        const pending = reports.filter(r => r.status === 'pending').length;
        const resolved = reports.filter(r => r.status === 'resolved').length;
        const critical = reports.filter(r => r.severity === 'critical').length;
        
        statsContainer.innerHTML = `
            <div class="stat-card"><div class="label">Total Reports</div><div class="value">${total}</div></div>
            <div class="stat-card"><div class="label">Pending</div><div class="value" style="color:#f59e0b;">${pending}</div></div>
            <div class="stat-card"><div class="label">Resolved</div><div class="value" style="color:#10b981;">${resolved}</div></div>
            <div class="stat-card"><div class="label">Critical</div><div class="value" style="color:#ef4444;">${critical}</div></div>
        `;
        
        tbody.innerHTML = reports.map(report => `
            <tr>
                <td><span style="color:#27c4cc;">#${report.id}</span></td>
                <td>${report.reporter_name || 'N/A'}</td>
                <td>${report.equipment_name || 'N/A'}</td>
                <td>${report.damage_type || 'N/A'}</td>
                <td><span class="badge badge-${report.severity === 'critical' ? 'danger' : report.severity === 'medium' ? 'warning' : 'info'}">${report.severity || 'Unknown'}</span></td>
                <td><span class="badge badge-${report.status === 'resolved' ? 'success' : report.status === 'in_progress' ? 'warning' : 'info'}">${report.status === 'resolved' ? 'Resolved' : report.status === 'in_progress' ? 'In Progress' : 'Pending'}</span></td>
                <td>
                    ${report.status !== 'resolved' ? `
                        <button class="btn btn-small btn-secondary" onclick="updateReportStatus(${report.id}, 'resolved')">Resolve</button>
                        <button class="btn btn-small btn-warning" onclick="updateReportStatus(${report.id}, 'in_progress')">In Progress</button>
                    ` : '<span style="color:#94a3b8;">Resolved</span>'}
                </td>
            </tr>
        `).join('');
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="7">Failed to load</td></tr>';
    }
}

window.updateReportStatus = async (reportId, newStatus) => {
    if (!confirm(`Mark this report as ${newStatus === 'resolved' ? 'resolved' : 'in progress'}?`)) return;
    
    try {
        const response = await fetch(`${API_URL}/damage-reports/${reportId}/status`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify({ status: newStatus })
        });
        
        if (response.ok) {
            alert('Report status updated!');
            loadDamageReports();
        } else {
            throw new Error('Failed to update status');
        }
    } catch(e) { 
        alert('Failed to update report status'); 
    }
};

function checkAuth() {
    const token = getToken();
    const role = localStorage.getItem('ulitms_role');
    if (!token || role !== 'admin') window.location.href = '../login.html';
}

checkAuth();
updateUserInfo();
loadDamageReports();
</script>
</body>
</html>
