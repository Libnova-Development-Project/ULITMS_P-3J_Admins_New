<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULITMS — Change Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/api-node.js"></script>
</head>
<body>

<div class="page-bg"><div class="glow1"></div><div class="glow2"></div></div>

<!-- Dynamic Sidebar Loading -->
<aside id="sidebar"></aside>
<script src="../js/sidebar-loader.js"></script>
<script>loadSidebar();</script>
<script src="../js/confirm-dialog.js"></script>

<div id="main">
    <header id="topbar">
        <div class="page-title">Change Password</div>
        <div class="topbar-right">
            <div class="notif-btn"><i class="fas fa-bell"></i></div>
            <div class="avatar" id="header-avatar" style="width:36px;height:36px;">G</div>
            <div>
                <div class="user-name" id="header-name" style="font-size:0.82rem;">Guest</div>
                <div class="user-role" id="header-role" style="font-size:0.7rem;">Visitor</div>
            </div>
        </div>
    </header>
    <div id="content">
        <div class="section-title">Change Password</div>
        <div class="section-sub">Keep your account secure</div>
        
        <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;max-width:900px;">
            <div class="card">
                <div class="card-title"><i class="fas fa-key" style="color:#27c4cc;margin-right:8px;"></i>Update Password</div>
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input type="password" id="current-password" class="form-input" placeholder="Enter current password">
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Confirm new password">
                </div>
                <button class="btn btn-primary" onclick="changePassword()">
                    <i class="fas fa-shield-halved" style="margin-right:8px;"></i>UPDATE PASSWORD
                </button>
            </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-circle-info" style="color:#fbbf24;margin-right:8px;"></i>Password Tips</div>
                <div class="tip-item"><div class="tip-dot"></div>At least 8 characters long</div>
                <div class="tip-item"><div class="tip-dot"></div>Include uppercase and lowercase letters</div>
                <div class="tip-item"><div class="tip-dot"></div>Use at least one number or symbol</div>
                <div class="tip-item"><div class="tip-dot"></div>Don't reuse your last 3 passwords</div>
                <div class="tip-item"><div class="tip-dot red"></div>Never share your password with anyone</div>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = window.location.origin + '/api';

function getToken() { return localStorage.getItem('ulitms_token'); }
function getUserId() { return localStorage.getItem('ulitms_user_id'); }

async function changePassword() {
    const currentPassword = document.getElementById('current-password').value;
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    
    if (!currentPassword || !newPassword || !confirmPassword) {
        showWarning('Please fill in all password fields');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        showWarning('New passwords do not match');
        return;
    }
    
    if (newPassword.length < 8) {
        showWarning('Password must be at least 8 characters long');
        return;
    }
    
    try {
        const response = await fetch(`${API_URL}/users/change-password`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify({
                current_password: currentPassword,
                new_password: newPassword,
                user_id: parseInt(getUserId())
            })
        });
        
        if (response.ok) {
            showSuccess('Password updated successfully!');
            document.getElementById('current-password').value = '';
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-password').value = '';
        } else {
            const data = await response.json();
            throw new Error(data.message || 'Failed to update password');
        }
    } catch(e) { 
        showError(e.message || 'Failed to update password'); 
    }
}

function checkAuth() {
    if (!getToken()) window.location.href = '../login.html';
}

checkAuth();
</script>
</body>
</html>
