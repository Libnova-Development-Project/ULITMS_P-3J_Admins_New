<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULITMS — Login</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="max-width:460px;width:100%;padding:32px;">
      <div id="signin-panel" class="auth-panel">
        <div class="auth-panel-heading">Log in to ULITMS</div>
        
        <div class="form-group">
          <label class="form-label" id="login-label">Student ID or Email</label>
          <input id="signin-identifier" type="text" class="form-input" placeholder="Enter your Student ID or Email" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="signin-password" type="password" class="form-input" placeholder="Enter your password" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Role</label>
          <select id="signin-role" class="form-input" onchange="toggleLoginField()">
            <option value="student">Student</option>
            <option value="admin">Admin / Librarian</option>
          </select>
        </div>
        
        <button class="btn-primary" onclick="login()" type="button" style="width:100%;">Log in</button>
        
        <div class="form-caption" style="margin-top:18px;">
          Don't have an account? <button class="link-button" type="button" onclick="showAuthPanel('signup')">Sign up</button>
        </div>
        
        <div id="demo-hint" style="margin-top:12px;color:#475569;font-size:12px;text-align:center;">
          🔑 Student: 2024-01018 | Password: student123
        </div>
      </div>

      <div id="signup-panel" class="auth-panel" style="display:none;">
        <div class="auth-panel-heading">Create Account</div>
        
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input id="signup-firstname" class="form-input" placeholder="Your first name" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input id="signup-lastname" class="form-input" placeholder="Your last name" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Student ID</label>
          <input id="signup-studentid" class="form-input" placeholder="e.g. 2024-12345" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input id="signup-email" type="email" class="form-input" placeholder="you@example.com" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Course</label>
          <input id="signup-course" class="form-input" placeholder="e.g. BS Information Technology" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Year Level</label>
          <select id="signup-year" class="form-input">
            <option value="">Select Year Level</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Contact Number</label>
          <input id="signup-contact" class="form-input" placeholder="09xx-xxx-xxxx" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="signup-password" type="password" class="form-input" placeholder="Create password (min 6 characters)" />
        </div>
        
        <button class="btn-primary" onclick="createAccount()" type="button" style="width:100%;">Create Account</button>
        
        <div class="form-caption" style="margin-top:18px;">
          Already have an account? <button class="link-button" type="button" onclick="showAuthPanel('signin')">Log in</button>
        </div>
      </div>

      <div id="success-panel" class="auth-panel" style="display:none;text-align:center;">
        <div class="auth-panel-heading">Account Created!</div>
        <div style="color:#cbd5e1;margin-bottom:20px;">Your account has been successfully created. You can now log in.</div>
        <button class="btn-primary" onclick="showAuthPanel('signin')" type="button">Log in</button>
      </div>
    </div>
  </div>
</body>
</html>
