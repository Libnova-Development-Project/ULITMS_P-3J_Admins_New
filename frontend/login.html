<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULITMS - Login & Sign Up</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 550px;
    overflow: hidden;
}

.tabs {
    display: flex;
    border-bottom: 2px solid #f0f0f0;
}

.tab {
    flex: 1;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    background: #f8f9fa;
    border: none;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s;
}

.tab.active {
    background: white;
    color: #667eea;
    border-bottom: 3px solid #667eea;
}

.tab:not(.active):hover {
    background: #e9ecef;
}

.form-container {
    padding: 30px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 500;
    font-size: 14px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.3s;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #667eea;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.format-hint {
    font-size: 11px;
    color: #999;
    margin-top: 5px;
}

button[type="submit"] {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    margin-top: 10px;
}

button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.error-message {
    background: #fee;
    color: #c33;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}

.success-message {
    background: #efe;
    color: #3c3;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    display: none;
}

.demo-info {
    margin-top: 20px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 8px;
    font-size: 12px;
    color: #666;
    text-align: center;
}

.demo-info p {
    margin: 5px 0;
}

h3 {
    color: #333;
    margin-bottom: 20px;
    text-align: center;
}

.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
    margin-right: 8px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    
    <div class="form-container">
        <!-- Login Form -->
        <div id="login-form">
            <h3>Welcome Back!</h3>
            <div id="login-error" class="error-message"></div>
            
            <div class="form-group">
                <label>Student ID or Email *</label>
                <input type="text" id="login-identifier" placeholder="Enter your Student ID (e.g., 24-A-00599) or Email">
            </div>
            
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="login-password" placeholder="Enter your password">
            </div>
            
            <div class="form-group">
                <label>Login as</label>
                <select id="login-role">
                    <option value="student">Student</option>
                    <option value="admin">Admin / Librarian</option>
                </select>
            </div>
            
            <button type="submit" onclick="handleLogin()">Login</button>
            
            <div class="demo-info">
                <strong>📚 Demo Accounts:</strong>
                <p>👨‍🎓 Student ID: 24-A-00599 | Password: student123</p>
                <p>👑 Admin Email: admin@ulitms.com | Password: admin123</p>
                <p style="margin-top: 8px;">💡 Student ID Format: YY-B-XXXXX (e.g., 24-A-00599)</p>
            </div>
        </div>
        
        <!-- Sign Up Form -->
        <div id="signup-form" style="display: none;">
            <h3>Create New Account</h3>
            <div id="signup-error" class="error-message"></div>
            <div id="signup-success" class="success-message"></div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="signup-firstname" placeholder="First name">
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="signup-lastname" placeholder="Last name">
                </div>
            </div>
            
            <div class="form-group">
                <label>Student ID *</label>
                <input type="text" id="signup-studentid" placeholder="e.g., 24-A-00599">
                <div class="format-hint">Format: YY-B-XXXXX (Year-Block-Number)</div>
            </div>
            
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="signup-email" placeholder="you@example.com">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Course</label>
                    <input type="text" id="signup-course" placeholder="e.g., BS Information Technology">
                </div>
                <div class="form-group">
                    <label>Year Level</label>
                    <select id="signup-year">
                        <option value="">Select Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" id="signup-contact" placeholder="09xx-xxx-xxxx">
            </div>
            
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="signup-password" placeholder="Minimum 6 characters">
            </div>
            
            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" id="signup-confirm" placeholder="Confirm your password">
            </div>
            
            <button type="submit" onclick="handleSignup()">Create Account</button>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';

function switchTab(tab) {
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const tabs = document.querySelectorAll('.tab');
    
    if (tab === 'login') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
        document.getElementById('login-error').style.display = 'none';
    } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        tabs[1].classList.add('active');
        tabs[0].classList.remove('active');
        document.getElementById('signup-error').style.display = 'none';
        document.getElementById('signup-success').style.display = 'none';
    }
}

async function handleLogin() {
    const identifier = document.getElementById('login-identifier').value.trim();
    const password = document.getElementById('login-password').value;
    const role = document.getElementById('login-role').value;
    const errorDiv = document.getElementById('login-error');
    const submitBtn = event.target;
    
    if (!identifier || !password) {
        errorDiv.textContent = 'Please enter your Student ID/Email and password';
        errorDiv.style.display = 'block';
        return;
    }
    
    errorDiv.style.display = 'none';
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<span class="loading"></span> Logging in...';
    submitBtn.disabled = true;
    
    try {
        const response = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password, role })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.message || 'Login failed');
        }
        
        const token = data.token || (data.data && data.data.token);
        const user = data.user || (data.data && data.data.user);
        
        if (token && user) {
            localStorage.setItem('ulitms_token', token);
            localStorage.setItem('ulitms_role', user.role);
            localStorage.setItem('ulitms_name', `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'User');
            localStorage.setItem('ulitms_email', user.email);
            localStorage.setItem('ulitms_studentid', user.student_id || '');
            localStorage.setItem('ulitms_user_id', user.id);
            
            window.location.href = '/index.html';
        } else {
            throw new Error('Invalid response from server');
        }
    } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
}

async function handleSignup() {
    const first_name = document.getElementById('signup-firstname').value.trim();
    const last_name = document.getElementById('signup-lastname').value.trim();
    const student_id = document.getElementById('signup-studentid').value.trim().toUpperCase();
    const email = document.getElementById('signup-email').value.trim();
    const course = document.getElementById('signup-course').value.trim();
    const year_level = document.getElementById('signup-year').value;
    const contact_number = document.getElementById('signup-contact').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    
    const errorDiv = document.getElementById('signup-error');
    const successDiv = document.getElementById('signup-success');
    const submitBtn = event.target;
    
    console.log('Form data:', { first_name, last_name, student_id, email, course, year_level, contact_number, password: '***' });
    
    // Validation
    if (!first_name) {
        errorDiv.textContent = 'First name is required';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    if (!last_name) {
        errorDiv.textContent = 'Last name is required';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    if (!student_id) {
        errorDiv.textContent = 'Student ID is required';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    if (!email) {
        errorDiv.textContent = 'Email is required';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    if (!password) {
        errorDiv.textContent = 'Password is required';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    if (password !== confirm) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    // Validate Student ID format
    const studentIdRegex = /^\d{2}-[A-Za-z]-\d{5}$/;
    if (!studentIdRegex.test(student_id)) {
        errorDiv.textContent = 'Student ID must be in format: YY-B-XXXXX (e.g., 24-A-00599)';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        return;
    }
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<span class="loading"></span> Creating account...';
    submitBtn.disabled = true;
    
    const requestData = {
        first_name,
        last_name,
        student_id,
        email,
        course: course || null,
        year_level: year_level ? parseInt(year_level) : null,
        contact_number: contact_number || null,
        password,
        role: 'student'
    };
    
    console.log('Sending request:', requestData);
    
    try {
        const response = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        });
        
        const data = await response.json();
        console.log('Response:', data);
        
        if (!response.ok) {
            throw new Error(data.message || 'Registration failed');
        }
        
        successDiv.textContent = 'Account created successfully! Please login.';
        successDiv.style.display = 'block';
        
        // Clear form
        document.getElementById('signup-firstname').value = '';
        document.getElementById('signup-lastname').value = '';
        document.getElementById('signup-studentid').value = '';
        document.getElementById('signup-email').value = '';
        document.getElementById('signup-course').value = '';
        document.getElementById('signup-year').value = '';
        document.getElementById('signup-contact').value = '';
        document.getElementById('signup-password').value = '';
        document.getElementById('signup-confirm').value = '';
        
        // Switch to login after 2 seconds
        setTimeout(() => {
            switchTab('login');
        }, 2000);
        
    } catch (error) {
        console.error('Signup error:', error);
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
}

// Allow Enter key to submit
document.getElementById('login-password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        handleLogin();
    }
});

document.getElementById('signup-confirm').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        handleSignup();
    }
});
</script>
</body>
</html>
