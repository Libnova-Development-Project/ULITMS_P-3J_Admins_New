<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULITMS — Library Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .login-card {
            width: 100%;
            max-width: 450px;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(39, 196, 204, 0.2);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
            text-align: center;
        }

        .logo-icon-box {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--teal-dark), var(--teal-primary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b1120;
            font-size: 1.5rem;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(39, 196, 204, 0.3);
        }

        .tabs-header {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            padding: 12px 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: var(--teal-primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--teal-primary);
        }

        .form-section {
            display: none;
            animation: slideUp 0.4s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .password-wrap {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 0.9rem;
            padding: 5px;
        }

        .password-toggle:hover {
            color: var(--teal-primary);
        }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--teal-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--teal-light);
            text-decoration: underline;
        }

        .forgot-link {
            display: block;
            margin-top: 12px;
            font-size: 0.8rem;
        }

        /* Message Styles */
        .msg {
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .msg.show { display: flex; }
        .msg.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger); }
        .msg.success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: var(--success); }
    </style>
</head>
<body>

<div class="page-bg"><div class="glow1"></div><div class="glow2"></div></div>

<div class="login-card">
    <div class="login-logo">
        <div class="logo-icon-box">
            <i class="fas fa-university"></i>
        </div>
        <div class="logo-title" style="font-size: 1.8rem;">ULITMS</div>
        <div class="logo-sub" style="font-size: 0.7rem; opacity: 0.6;">Integrated Library System</div>
    </div>

    <div class="tabs-header">
        <button class="tab-btn active" onclick="switchTab('login')">Login Access</button>
        <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div id="login-msg" class="msg"></div>

    <!-- Login Form -->
    <div id="login-form" class="form-section active">
        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="text" id="login-identifier" class="form-input" placeholder="Enter your registered email">
        </div>
        
        <div class="form-group">
            <label class="form-label">Secure Password</label>
            <div class="password-wrap">
                <input type="password" id="login-password" class="form-input" placeholder="••••••••">
                <span class="password-toggle" onclick="togglePassword('login-password', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="handleLogin()" id="login-btn">
            <span>Login</span>
        </button>

        <div class="footer-links">
            <div>Didn't sign up yet? <a href="javascript:void(0)" onclick="switchTab('signup')">Sign Up</a></div>
            <a href="javascript:void(0)" class="forgot-link" onclick="switchTab('forgot')">Forgot your password?</a>
        </div>
    </div>

    <!-- Forgot Password Form -->
    <div id="forgot-form" class="form-section">
        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="text" id="forgot-identifier" class="form-input" placeholder="Enter your registered ID/Email">
            <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 8px;">A 6-digit recovery PIN will be generated for your account.</p>
        </div>
        
        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="handleForgotSubmit()" id="forgot-btn">
            <span>Generate Recovery PIN</span>
        </button>

        <div class="footer-links">
            <a href="javascript:void(0)" onclick="switchTab('login')">Return to Login</a>
        </div>
    </div>

    <!-- Reset Password Form -->
    <div id="reset-form" class="form-section">
        <div class="form-group">
            <label class="form-label">6-Digit Recovery PIN</label>
            <input type="text" id="reset-pin" class="form-input" placeholder="000000" maxlength="6" style="text-align: center; letter-spacing: 5px; font-weight: 800;">
        </div>

        <div class="form-group">
            <label class="form-label">New Secure Password</label>
            <div class="password-wrap">
                <input type="password" id="reset-new-password" class="form-input" placeholder="Minimum 8 characters">
                <span class="password-toggle" onclick="togglePassword('reset-new-password', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
        </div>
        
        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="handleResetSubmit()" id="reset-btn">
            <span>Reset My Password</span>
        </button>

        <div class="footer-links">
            <a href="javascript:void(0)" onclick="switchTab('forgot')">Back to Step 1</a>
        </div>
    </div>

    <!-- Signup Form -->
    <div id="signup-form" class="form-section">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" id="signup-firstname" class="form-input" placeholder="John">
            </div>
            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" id="signup-lastname" class="form-input" placeholder="Doe">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Student ID Number</label>
            <input type="text" id="signup-studentid" class="form-input" placeholder="24-A-00XXX">
        </div>
        
        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="signup-email" class="form-input" placeholder="name@school.edu">
        </div>

        <div class="form-group">
            <label class="form-label">Account Password</label>
            <div class="password-wrap">
                <input type="password" id="signup-password" class="form-input" placeholder="Minimum 8 characters">
                <span class="password-toggle" onclick="togglePassword('signup-password', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="handleSignup()" id="signup-btn">
            <span>Register Account</span>
        </button>

        <div class="footer-links">
            <div>Already have an account? <a href="javascript:void(0)" onclick="switchTab('login')">Login Here</a></div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5000/api';
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.tab-btn[onclick*="${tab}"]`);
        if (btn) btn.classList.add('active');
        document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
        const section = document.getElementById(`${tab}-form`);
        if (section) section.classList.add('active');
        document.getElementById('login-msg').classList.remove('show');
    }
    function togglePassword(inputId, el) {
        const input=document.getElementById(inputId), icon=el.querySelector('i');
        input.type=input.type==='password'?'text':'password';
        icon.classList.toggle('fa-eye',input.type==='password');
        icon.classList.toggle('fa-eye-slash',input.type==='text');
    }
    function showMsg(message,type='error') {
        const msg=document.getElementById('login-msg'); msg.textContent=message; msg.className=`msg show ${type}`;
    }
    function saveLogin(payload) {
        const auth=payload.data || payload, user=auth.user, token=auth.token;
        if(!user || !token) throw new Error('The server response did not include a valid login token.');
        localStorage.setItem('ulitms_token',token);
        localStorage.setItem('ulitms_user',JSON.stringify(user));
        localStorage.setItem('ulitms_user_id',user.user_id ?? user.id);
        localStorage.setItem('ulitms_name',[user.first_name,user.last_name].filter(Boolean).join(' '));
        localStorage.setItem('ulitms_role',user.role);
        localStorage.setItem('ulitms_email',user.email || '');
        localStorage.setItem('ulitms_studentid',user.student_number || user.student_id || '');
        localStorage.setItem('ulitms_avatar',user.profile_picture || '');
        return user;
    }
    async function handleLogin() {
        const email=document.getElementById('login-identifier').value.trim();
        const password=document.getElementById('login-password').value;
        if(!email || !password) return showMsg('Please enter your email address and password.');
        const btn=document.getElementById('login-btn'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Authenticating...';
        try {
            const response=await fetch(`${API_URL}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
            const payload=await response.json();
            if(!response.ok || payload.success===false) throw new Error(payload.message || 'Login failed.');
            const user=saveLogin(payload);
            showMsg('Login successful! Opening your dashboard...','success');
            setTimeout(()=>location.href=user.role==='admin'?'pages/dashboard.html':'pages/catalog.html',650);
        } catch(error) { showMsg(error.message || 'Unable to connect to the server.'); btn.disabled=false; btn.innerHTML='<span>Login</span>'; }
    }
    async function handleSignup() {
        const first_name=document.getElementById('signup-firstname').value.trim();
        const last_name=document.getElementById('signup-lastname').value.trim();
        const student_number=document.getElementById('signup-studentid').value.trim();
        const email=document.getElementById('signup-email').value.trim();
        const password=document.getElementById('signup-password').value;
        if(!first_name||!last_name||!student_number||!email||!password) return showMsg('Please complete all registration fields.');
        const btn=document.getElementById('signup-btn'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Creating...';
        try {
            const response=await fetch(`${API_URL}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({first_name,last_name,student_number,email,password})});
            const payload=await response.json();
            if(!response.ok || payload.success===false) throw new Error(payload.message || 'Registration failed.');
            showMsg('Account created successfully. You can now log in.','success'); switchTab('login');
            document.getElementById('login-identifier').value=email;
        } catch(error) { showMsg(error.message || 'Registration failed.'); }
        finally { btn.disabled=false; btn.innerHTML='<span>Register Account</span>'; }
    }
    async function handleForgotSubmit() {
        showMsg('Password recovery is not configured in the current backend. Please contact the library administrator.');
    }
    async function handleResetSubmit() {
        showMsg('Password reset is not configured in the current backend. If you are signed in, use the Change Password page.');
    }
    document.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
            if(document.getElementById('login-form').classList.contains('active')) handleLogin();
            else if(document.getElementById('signup-form').classList.contains('active')) handleSignup();
        }
    });
</script>

</body>
</html>
