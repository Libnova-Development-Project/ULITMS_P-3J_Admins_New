<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULITMS - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }
        .tabs { display: flex; border-bottom: 1px solid #e5e7eb; }
        .tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.3s;
        }
        .tab.active { color: #667eea; border-bottom: 2px solid #667eea; }
        .form-container { padding: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            margin-bottom: 8px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #5a67d8; transform: translateY(-1px); }
        .error-message, .success-message {
            padding: 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: none;
        }
        .error-message { background: #fee2e2; color: #dc2626; }
        .success-message { background: #d1fae5; color: #059669; }
        .demo-info {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
        }
        .demo-info p { margin: 5px 0; }
        .format-hint { font-size: 0.7rem; color: #9ca3af; margin-top: 5px; }
        h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #1f2937; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    
    <div class="form-container">
        <div id="login-form">
            <h3>Welcome Back</h3>
            <div id="login-error" class="error-message"></div>
            <div class="form-group">
                <label class="form-label">Student ID or Email</label>
                <input type="text" id="login-identifier" class="form-input" placeholder="24-A-00599 or email@example.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="login-password" class="form-input" placeholder="Enter your password">
            </div>
            <div class="form-group">
                <label class="form-label">Login as</label>
                <select id="login-role" class="form-select">
                    <option value="student">Student</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            <button class="btn" onclick="handleLogin()">Login</button>
            <div class="demo-info">
                <strong>Demo Accounts</strong>
                <p>Student: 24-A-00599 / student123</p>
                <p>Admin: admin@ulitms.com / admin123</p>
            </div>
        </div>
        
        <div id="signup-form" style="display: none;">
            <h3>Create Account</h3>
            <div id="signup-error" class="error-message"></div>
            <div id="signup-success" class="success-message"></div>
            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" id="signup-firstname" class="form-input" placeholder="John">
            </div>
            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" id="signup-lastname" class="form-input" placeholder="Doe">
            </div>
            <div class="form-group">
                <label class="form-label">Student ID</label>
                <input type="text" id="signup-studentid" class="form-input" placeholder="24-A-00599">
                <div class="format-hint">Format: YY-B-XXXXX (e.g., 24-A-00599)</div>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="signup-email" class="form-input" placeholder="student@university.edu">
            </div>
            <div class="form-group">
                <label class="form-label">Course</label>
                <input type="text" id="signup-course" class="form-input" placeholder="BS Information Technology">
            </div>
            <div class="form-group">
                <label class="form-label">Year Level</label>
                <select id="signup-year" class="form-select">
                    <option value="">Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Contact Number</label>
                <input type="tel" id="signup-contact" class="form-input" placeholder="09123456789">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="signup-password" class="form-input" placeholder="Min. 6 characters">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm your password">
            </div>
            <button class="btn" onclick="handleSignup()">Create Account</button>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';

function switchTab(tab) {
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
    });
}

async function handleLogin() {
    const identifier = document.getElementById('login-identifier').value.trim();
    const password = document.getElementById('login-password').value;
    const role = document.getElementById('login-role').value;
    const errorDiv = document.getElementById('login-error');
    
    if (!identifier || !password) {
        errorDiv.textContent = 'Please enter your credentials';
        errorDiv.style.display = 'block';
        return;
    }
    
    errorDiv.style.display = 'none';
    
    try {
        const response = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password, role })
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);
        
        const token = data.token || data.data?.token;
        const user = data.user || data.data?.user;
        
        if (token && user) {
            localStorage.setItem('ulitms_token', token);
            localStorage.setItem('ulitms_role', user.role);
            localStorage.setItem('ulitms_name', `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'User');
            localStorage.setItem('ulitms_email', user.email);
            localStorage.setItem('ulitms_studentid', user.student_id || '');
            localStorage.setItem('ulitms_user_id', user.id);
            window.location.href = '/index.html';
        }
    } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
    }
}

async function handleSignup() {
    const data = {
        first_name: document.getElementById('signup-firstname').value.trim(),
        last_name: document.getElementById('signup-lastname').value.trim(),
        student_id: document.getElementById('signup-studentid').value.trim().toUpperCase(),
        email: document.getElementById('signup-email').value.trim(),
        course: document.getElementById('signup-course').value.trim(),
        year_level: document.getElementById('signup-year').value,
        contact_number: document.getElementById('signup-contact').value.trim(),
        password: document.getElementById('signup-password').value,
        confirm: document.getElementById('signup-confirm').value
    };
    
    const errorDiv = document.getElementById('signup-error');
    const successDiv = document.getElementById('signup-success');
    
    if (!data.first_name || !data.last_name || !data.student_id || !data.email || !data.password) {
        errorDiv.textContent = 'Please fill all required fields';
        errorDiv.style.display = 'block';
        return;
    }
    
    if (data.password !== data.confirm) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
    }
    
    if (data.password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.style.display = 'block';
        return;
    }
    
    if (!/^\d{2}-[A-Za-z]-\d{5}$/.test(data.student_id)) {
        errorDiv.textContent = 'Student ID must be in format: YY-B-XXXXX (e.g., 24-A-00599)';
        errorDiv.style.display = 'block';
        return;
    }
    
    errorDiv.style.display = 'none';
    
    try {
        const response = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                first_name: data.first_name,
                last_name: data.last_name,
                student_id: data.student_id,
                email: data.email,
                course: data.course || null,
                year_level: data.year_level ? parseInt(data.year_level) : null,
                contact_number: data.contact_number || null,
                password: data.password,
                role: 'student'
            })
        });
        
        const result = await response.json();
        if (!response.ok) throw new Error(result.message);
        
        successDiv.textContent = 'Account created! Redirecting to login...';
        successDiv.style.display = 'block';
        
        setTimeout(() => switchTab('login'), 2000);
    } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
    }
}
</script>
</body>
</html>
