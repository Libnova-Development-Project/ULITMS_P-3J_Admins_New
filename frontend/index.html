<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULITMS — University Library System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="page-bg"><div class="glow1"></div><div class="glow2"></div></div>

<div class="auth-shell">
    <div class="auth-card" style="max-width:500px;width:100%;padding:40px;text-align:center;">
        <div style="margin-bottom:30px;">
            <div style="font-family: 'Syne', sans-serif; font-size: 2.5rem; font-weight: 800; color: #27c4cc; margin-bottom: 8px;">ULITMS</div>
            <div style="font-size: 0.8rem; color: #6adde2; letter-spacing: 2px; text-transform: uppercase;">University Library System</div>
        </div>
        
        <div id="welcome-section">
            <h2 style="color: #e2e8f0; margin-bottom: 16px;">Welcome to ULITMS</h2>
            <p style="color: #94a3b8; margin-bottom: 30px; line-height: 1.6;">
                Please select your role to continue to the library management system
            </p>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                <button class="btn-primary" onclick="goToStudent()" style="padding: 20px; font-size: 1.1rem;">
                    <i class="fas fa-user-graduate" style="margin-right: 12px;"></i>
                    Student Portal
                </button>
                <button class="btn-secondary" onclick="goToAdmin()" style="padding: 20px; font-size: 1.1rem;">
                    <i class="fas fa-user-shield" style="margin-right: 12px;"></i>
                    Admin Portal
                </button>
            </div>
            
            <div style="border-top: 1px solid rgba(12, 168, 177, 0.2); padding-top: 20px;">
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 16px;">
                    Already have an account? You'll be redirected to login if not authenticated.
                </p>
                <button class="btn btn-small" onclick="goToLogin()">
                    <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>
                    Go to Login
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function getToken() { return localStorage.getItem('ulitms_token'); }
function getUserRole() { return localStorage.getItem('ulitms_role'); }

function checkAuth() {
    const token = getToken();
    const role = getUserRole();
    
    if (token && role) {
        // User is logged in, redirect to appropriate dashboard
        if (role === 'admin') {
            window.location.href = 'pages/dashboard.html';
        } else {
            window.location.href = 'pages/dashboard.html';
        }
    }
    // If not logged in, show the welcome screen
}

window.goToStudent = () => {
    // Check if student is logged in
    const token = getToken();
    const role = getUserRole();
    
    if (token && role === 'student') {
        window.location.href = 'pages/dashboard.html';
    } else {
        window.location.href = 'login.html';
    }
};

window.goToAdmin = () => {
    // Check if admin is logged in
    const token = getToken();
    const role = getUserRole();
    
    if (token && role === 'admin') {
        window.location.href = 'pages/dashboard.html';
    } else {
        window.location.href = 'login.html';
    }
};

window.goToLogin = () => {
    window.location.href = 'login.html';
};

// Check authentication on page load
checkAuth();
</script>
</body>
</html>
